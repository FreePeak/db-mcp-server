name: Vulnerability Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26'
        check-latest: true

    - name: Check out code
      uses: actions/checkout@v4

    - name: Install govulncheck
      # Pinned rather than @latest so a new scanner release cannot change
      # CI results without a change in this repository.
      run: go install golang.org/x/vuln/cmd/govulncheck@v1.10.0

    - name: Run govulncheck
      # Blocking: exits non-zero when a vulnerable symbol is reachable from
      # this module's code. Only reachable findings fail the job.
      run: govulncheck ./...
