name: Release artifacts

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (for example 1.12.0)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  get-version:
    name: Validate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Read and validate package version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION='${{ inputs.version }}'
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          test "$VERSION" = "$PACKAGE_VERSION" || {
            echo "Tag/input version $VERSION does not match package.json $PACKAGE_VERSION" >&2
            exit 1
          }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

  verify:
    name: Verify source
    needs: get-version
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.0"
          check-latest: true
      - name: Download Go modules
        run: go mod download
      - name: Test and vet
        run: |
          go test -short ./...
          go vet ./...
      - name: Validate npm launchers
        run: node --check bin/run.js && node --check bin/install.js
      - name: Test the installer checksum parser
        # The release manifest is generated as `sha256sum release/db-mcp-server-*`,
        # so entries carry a release/ prefix. A parser that only compares the whole
        # field makes every install fail — the tarball check below catches it end
        # to end, this catches it in seconds.
        run: node --test bin/install.test.js

  build-and-release:
    name: Build and release
    needs: [get-version, verify]
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.0"
          check-latest: true
      - name: Install dependencies
        run: go mod download
      - name: Build release binaries
        run: |
          VERSION=${{ needs.get-version.outputs.version }}
          mkdir -p release
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -o release/db-mcp-server-darwin-amd64 -ldflags="-s -w -X main.version=$VERSION" ./cmd/server
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -o release/db-mcp-server-darwin-arm64 -ldflags="-s -w -X main.version=$VERSION" ./cmd/server
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o release/db-mcp-server-linux-amd64 -ldflags="-s -w -X main.version=$VERSION" ./cmd/server
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o release/db-mcp-server-linux-arm64 -ldflags="-s -w -X main.version=$VERSION" ./cmd/server
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o release/db-mcp-server-windows-amd64.exe -ldflags="-s -w -X main.version=$VERSION" ./cmd/server
          GOOS=windows GOARCH=arm64 CGO_ENABLED=0 go build -o release/db-mcp-server-windows-arm64.exe -ldflags="-s -w -X main.version=$VERSION" ./cmd/server
          sha256sum release/db-mcp-server-* > release/SHA256SUMS
      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.get-version.outputs.version }}
          name: Release v${{ needs.get-version.outputs.version }}
          draft: false
          prerelease: false
          files: |
            release/db-mcp-server-darwin-amd64
            release/db-mcp-server-darwin-arm64
            release/db-mcp-server-linux-amd64
            release/db-mcp-server-linux-arm64
            release/db-mcp-server-windows-amd64.exe
            release/db-mcp-server-windows-arm64.exe
            release/SHA256SUMS
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    name: Publish npm package
    needs: [get-version, verify, build-and-release]
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org
      - name: Check npm credentials
        run: test -n "${NPM_TOKEN:-}"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Inspect package contents
        run: npm pack --dry-run --json > package-manifest.json
      - name: Install the packed tarball end to end
        # The tarball's postinstall downloads the release binary and verifies it
        # against SHA256SUMS, so this is the only check that would have caught
        # "publishes fine, installs for nobody".
        run: |
          VERSION=${{ needs.get-version.outputs.version }}
          TARBALL=$(npm pack --pack-destination "$RUNNER_TEMP" --silent)
          mkdir -p "$RUNNER_TEMP/npm-smoke"
          npm install --prefix "$RUNNER_TEMP/npm-smoke" --no-save "$RUNNER_TEMP/$TARBALL"
          "$RUNNER_TEMP/npm-smoke/node_modules/.bin/db-mcp-server" --help > /dev/null
          echo "Installed and ran db-mcp-server v$VERSION from the packed tarball"
      - name: Publish package
        run: |
          VERSION=${{ needs.get-version.outputs.version }}
          PKG_NAME=$(node -p "require('./package.json').name")
          if npm view "$PKG_NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$PKG_NAME@$VERSION is already published; skipping"
            exit 0
          fi
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
