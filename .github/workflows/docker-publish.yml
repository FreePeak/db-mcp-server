name: docker

# Resolves FreePeak/db-mcp-server issue #59: the Docker Hub image was
# 10+ months stale and missed features added since. This workflow builds
# multi-arch (amd64 + arm64) images on every push to main and on every
# published release tag, then pushes them to Docker Hub under
# freepeak/db-mcp-server.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing git tag to build and publish (e.g. v1.9.0). Leave empty for a normal main build.'
        required: false
        type: string

env:
  REGISTRY: docker.io
  IMAGE_NAME: freepeak/db-mcp-server

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Backfill mode (issue #83): when dispatched with a tag input, check
          # out that existing tag; otherwise use the default triggering ref.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check Docker Hub credentials
        id: creds
        # Fail fast with an actionable message instead of a cryptic
        # login error (root cause of issue #83). A tag push or a manual
        # backfill is a real publish, so missing secrets fail the run;
        # a plain push to main is only a build check (issue #86), so it
        # warns and skips the push instead of turning the run red.
        if: github.event_name != 'pull_request'
        run: |
          if [ -n "${DOCKERHUB_USERNAME:-}" ] && [ -n "${DOCKERHUB_TOKEN:-}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          msg="DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets are not set. Add them under Settings - Secrets and variables - Actions, then re-run this workflow. See issue #86."
          if [ "$GITHUB_REF_TYPE" = "tag" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "::error::${msg}"
            exit 1
          fi
          echo "::warning::${msg}"
          echo "::warning::Publishing to Docker Hub is skipped for this run; the image is still built to verify the Dockerfile."
          echo "ready=false" >> "$GITHUB_OUTPUT"
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && steps.creds.outputs.ready == 'true'
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute metadata
        id: meta
        # Skipped in backfill mode (issue #83): its tag rules would add
        # `latest` and sha tags, which must not be pushed for old releases.
        if: github.event_name != 'workflow_dispatch' || inputs.tag == ''
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - name: Compute backfill tags
        id: backfill_tags
        # Backfill mode only: publish an old tag as bare <version> and
        # <major.minor>, never `latest` or `sha-*` (issue #83).
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        run: |
          tag="${{ inputs.tag }}"
          version="${tag#v}"
          majmin="${version%.*}"
          echo "Backfilling ${tag} as ${REGISTRY}/${IMAGE_NAME}:${version} and :${majmin} (no latest/sha tags)"
          {
            echo "version=${version}"
            echo "majmin=${majmin}"
            echo "tags<<TAGS_EOF"
            echo "${REGISTRY}/${IMAGE_NAME}:${version}"
            echo "${REGISTRY}/${IMAGE_NAME}:${majmin}"
            echo "TAGS_EOF"
            echo "labels<<LABELS_EOF"
            echo "org.opencontainers.image.version=${version}"
            echo "LABELS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.creds.outputs.ready == 'true' }}
          tags: ${{ steps.backfill_tags.outputs.tags || steps.meta.outputs.tags }}
          labels: ${{ steps.backfill_tags.outputs.labels || steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
