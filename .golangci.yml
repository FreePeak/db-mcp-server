version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unused
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
      exclude-functions:
        - os.Setenv
    revive:
      rules:
        - name: var-naming
          severity: warning
          disabled: false
        - name: exported
          severity: warning
          disabled: false
    staticcheck:
      # QF1012 is style-only (WriteString(Sprintf) to Fprintf); v1.64.8 never ran quickfix checks.
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -QF1012
  exclusions:
    generated: lax
    rules:
      - path: internal/delivery/mcp/tool_registry.go
        text: Error return value of `tr.registerTool` is not checked
      - path: internal/delivery/mcp/tool_registry.go
        text: Error return value of `tr.createToolAlias` is not checked
      - path: cmd/server/main.go
        text: Error return value of `os.Setenv` is not checked
      - linters:
          - errcheck
        path: _test\.go$
      - linters:
          - unused
        path: pkg/dbtools/dbtools.go
        text: func `_loadConfigFromFile` is unused
      - linters:
          - unused
        path: pkg/dbtools/dbtools.go
        text: func `_getEnv` is unused
      - linters:
          - unused
        path: pkg/dbtools/dbtools.go
        text: func `_getIntEnv` is unused
      - linters:
          - unused
        path: pkg/dbtools/dbtools.go
        text: func `_loadConfigFromEnv` is unused
      - path: (.+)\.go$
        text: exported \w+ (\S*['.]*)([a-zA-Z'.*]*) should have comment or be unexported
    paths:
      - vendor/
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/FreePeak/db-mcp-server
  exclusions:
    generated: lax
    paths:
      - vendor/
